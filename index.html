<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chain of Thought</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap"><style>:root{
  --bg:#F4F2EE;--surface:#FFFFFF;--ink:#1B2230;--muted:#586274;--rule:#D9D5CC;--field:#FAF9F6;
  --red:#C03A2E;--red-ink:#FFFFFF;--ok:#2C7A4B;--bad:#8F3A2E;
  --font-display:'Old Standard TT','Bodoni 72',Didot,Georgia,serif;
  --font-ui:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#14171D;--surface:#1D222B;--ink:#ECE9E2;--muted:#A3A9B5;--rule:#363C48;--field:#171B22;--red:#E0594B;--red-ink:#14181F;--ok:#5CC08A;--bad:#F2A090;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#14171D;--surface:#1D222B;--ink:#ECE9E2;--muted:#A3A9B5;--rule:#363C48;--field:#171B22;--red:#E0594B;--red-ink:#14181F;--ok:#5CC08A;--bad:#F2A090;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5;
  padding:clamp(28px,6vw,64px) max(16px,env(safe-area-inset-right,0px)) 72px max(16px,env(safe-area-inset-left,0px))}
h1,h2,p,ol,fieldset,legend{margin:0;padding:0}
ol{list-style:none}
.wrap{max-width:640px;margin:0 auto}
header{display:grid;gap:10px;margin-bottom:28px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(34px,8vw,52px);line-height:1.05;letter-spacing:-.01em}
.blurb{color:var(--muted);font-size:17px}
.sheet{overflow:hidden}
.board{background:var(--surface);border:1px solid var(--ink);border-radius:10px;box-shadow:inset 0 0 0 4px var(--surface),inset 0 0 0 5px var(--rule);padding:26px 26px 24px}
@media (max-width:420px){.board{padding:22px 18px 20px}}
.premises{display:grid;gap:16px}
.premises li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:14px;align-items:start}
.counter{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--red);color:var(--red-ink);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.ptext{font-family:var(--font-display);font-size:clamp(19px,3vw,22px);line-height:28px;overflow-wrap:break-word}
.note{margin-top:16px;font-size:13px;color:var(--muted)}
fieldset{border:0;min-width:0;margin-top:26px;padding-top:20px;border-top:1px solid var(--rule)}
legend{font-family:var(--font-display);font-style:italic;font-size:21px;padding:0;margin-bottom:14px;width:100%}
.sym{color:var(--red);font-style:normal;margin-right:8px}
.stem{font-family:var(--font-display);font-size:clamp(19px,3vw,22px);margin:0 0 12px}
.opts{display:grid;gap:10px}
.opt{position:relative;display:block}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:block;padding:12px 16px;border:1px solid var(--rule);border-radius:8px;background:var(--field);font-size:17px;overflow-wrap:break-word}
.opt:hover span{border-color:var(--ink)}
.opt input:checked+span{border-color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--ink)}
.opt input:focus-visible+span{outline:2px solid var(--red);outline-offset:2px}
.btn{margin-top:20px;font:inherit;font-weight:600;font-size:16px;min-height:44px;padding:9px 22px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--surface);cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
#board:focus{outline:none}
.sheet.enter{animation:rise .6s ease backwards}
.btn:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.once{margin-top:10px;font-size:13px;color:var(--muted)}
/* melt away */
.sheet{transition:max-height .7s ease,opacity .5s ease,filter .6s ease,margin .7s ease}
.sheet.melting{opacity:0;filter:blur(6px)}
.sheet.gone{display:none}
.result{display:none;gap:16px}
.result.show{display:grid;animation:rise .6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.verdict{font-size:17px}
.verdict.ok{color:var(--ok)}
.verdict.no{color:var(--bad)}
.card{display:grid;gap:8px;padding:22px 24px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;color:inherit;text-decoration:none;border-top:4px solid var(--red)}
.card:hover{border-color:var(--ink);border-top-color:var(--red)}
.card:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.headline{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,5vw,34px);line-height:1.15;text-wrap:balance;overflow-wrap:break-word}
.meta{font-size:14px;color:var(--muted)}
.go{margin-top:6px;font-weight:600;font-size:15px}

.prev{margin-top:14px}
.prev h2{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--ink)}
.prevlist{list-style:none;margin:0;padding:0}
.prevlist li{border-bottom:1px solid var(--rule)}
.prevlist a{display:grid;gap:2px;padding:12px 2px;color:inherit;text-decoration:none}
.prevlist a:hover .ph{text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:3px}
.prevlist a:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.ph{font-family:var(--font-display);font-weight:700;font-size:19px;line-height:1.25;overflow-wrap:break-word}
.pm{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.sheet,.result.show{transition:none!important;animation:none!important}}
</style></head><body><div class="wrap">
  <header>
    <h1>Chain of Thought</h1>
    <p class="blurb" id="blurb">Deduce a conclusion from the logical premises below.</p>
  </header>
  <div class="sheet" id="sheet">
    <section class="board" id="board" tabindex="-1" aria-label="Puzzle">
      <ol class="premises" id="premises"></ol>
      <p class="note" id="note" hidden></p>
      <form id="form" novalidate>
        <fieldset>
          <legend id="ask"></legend>
          <p class="stem" id="stem" hidden></p>
          <div class="opts" id="opts"></div>
        </fieldset>
        <button type="submit" class="btn" id="go" disabled>Submit answer</button>
        <p class="once">You get one attempt.</p>
      </form>
    </section>
  </div>
  <section class="result" id="result" aria-live="polite">
    <p class="verdict" id="verdict"></p>
    <a class="card" id="card" target="_blank" rel="noopener noreferrer">
      <span class="kicker" id="kicker"></span>
      <span class="headline" id="headline"></span>
      <span class="meta" id="meta"></span>
      <span class="go">Read the story &rarr;</span>
    </a>
    <div class="prev" id="prev" hidden>
      <h2>See previous stories</h2>
      <ul class="prevlist" id="prevlist"></ul>
    </div>
    <div><button type="button" class="btn ghost" id="next" hidden>Next puzzle</button></div>
  </section>
</div>
<script>window.PUZZLE={"puzzles":[{"premises":["Nobody enjoys karaoke unless he or she cannot water-ski.","Only someone who builds a high street cannot water-ski.","Prince William enjoys karaoke.","Nobody works in construction unless he or she cannot water-ski."],"ask":"What can we conclude about Prince William?","stem":"Prince William …","note":"Read “unless”, “only” and “except” as one-way conditions. “Only gardeners own spades” means every spade owner is a gardener, not that every gardener owns a spade.","options":["works in construction","builds a high street","does not build a high street","does not work in construction"],"correct":1,"headline":"Prince William builds a high street","url":"https://www.economist.com/britain/2026/10/26/prince-william-builds-a-high-street","section":"Britain","date":"26 October 2026","previous":[]},{"premises":["Nowhere has excellent cuisine unless it has not banned waffle-irons.","Nowhere that has not banned waffle-irons is turning against Israel.","Latin America has excellent cuisine.","Latin America is this year's hot destination."],"ask":"What can we conclude about Latin America?","stem":"Latin America …","note":"Read “unless”, “only” and “except” as one-way conditions. “Only gardeners own spades” means every spade owner is a gardener, not that every gardener owns a spade.","options":["is turning against Israel","is embracing Israel"],"correct":1,"headline":"Latin America is embracing Israel","url":"https://www.economist.com/the-americas/2026/10/22/latin-america-is-embracing-israel","section":"The americas","date":"22 October 2026","previous":[]},{"premises":["Nowhere that does not have candy-cane forests is renouncing an ancient pact.","Nowhere that is where unicorns live has candy-cane forests.","The City of London is where unicorns live."],"ask":"What can we conclude about The City of London?","stem":"The City of London …","note":"","options":["is renouncing an ancient pact","honours an ancient pact"],"correct":1,"headline":"The City of London honours an ancient pact","url":"https://www.economist.com/the-americas/2026/10/22/latin-america-is-embracing-israel","section":"The americas","date":"22 October 2026","previous":[]},{"premises":["Nothing that has die-hard fans does not need good advertising.","Professional sumo wrestling is a popular sport.","Everything that needs good advertising comes to America.","Nothing that is a popular sport does not have die-hard fans."],"ask":"What can we conclude about Professional sumo wrestling?","stem":"Professional sumo wrestling …","note":"","options":["is leaving America","comes to America"],"correct":1,"headline":"Professional sumo wrestling comes to America","url":"https://www.economist.com/united-states/2026/10/09/professional-sumo-wrestling-comes-to-america","section":"United states","date":"9 October 2026","previous":[]}]};
(function(){
  'use strict';
  var D=window.PUZZLE,SET=!!D.puzzles,LIST=SET?D.puzzles:[D],idx=0,done=false;
  function $(id){return document.getElementById(id);}
  function clear(el){while(el.firstChild)el.removeChild(el.firstChild);}
  function show(i,animate){
    idx=i;done=false;
    var P=LIST[i],ps=$('premises'),lg=$('ask'),box=$('opts'),sheet=$('sheet');
    clear(ps);clear(lg);clear(box);clear($('prevlist'));
    P.premises.forEach(function(t,k){
      var li=document.createElement('li'),c=document.createElement('span'),p=document.createElement('p');
      c.className='counter';c.textContent=String(k+1);p.className='ptext';p.textContent=t;
      li.appendChild(c);li.appendChild(p);ps.appendChild(li);
    });
    $('note').hidden=!P.note;$('note').textContent=P.note||'';
    var sym=document.createElement('span');sym.className='sym';sym.setAttribute('aria-hidden','true');sym.textContent='∴';
    lg.appendChild(sym);lg.appendChild(document.createTextNode(P.ask));
    $('stem').hidden=!P.stem;$('stem').textContent=P.stem||'';
    P.options.forEach(function(t,k){
      var l=document.createElement('label'),inp=document.createElement('input'),s=document.createElement('span');
      l.className='opt';inp.type='radio';inp.name='answer';inp.value=String(k);s.textContent=t;
      l.appendChild(inp);l.appendChild(s);box.appendChild(l);
    });
    $('go').disabled=true;
    sheet.className='sheet'+(animate?' enter':'');sheet.style.maxHeight='';
    $('result').className='result';$('verdict').textContent='';$('verdict').className='verdict';
    $('prev').hidden=true;$('next').hidden=true;$('blurb').hidden=false;
    if(animate){window.scrollTo(0,0);$('board').focus();}
  }
  $('form').addEventListener('change',function(){$('go').disabled=done||!document.querySelector('input[name=answer]:checked');});
  $('form').addEventListener('submit',function(e){
    e.preventDefault();
    if(done)return;
    var ch=document.querySelector('input[name=answer]:checked');
    if(!ch)return;
    done=true;$('go').disabled=true;
    var P=LIST[idx],right=parseInt(ch.value,10)===P.correct,v=$('verdict');
    v.className='verdict '+(right?'ok':'no');
    v.textContent=right?'Correct.':'Not quite.';
    $('headline').textContent=P.headline;
    $('kicker').textContent=P.section||'Read more';
    $('meta').textContent=P.date||'';$('meta').hidden=!P.date;
    if(/^https:\/\//i.test(P.url))$('card').href=P.url;else $('card').removeAttribute('href');
    var prev=SET?LIST.slice(Math.max(0,idx-3),idx).reverse():(D.previous||[]),pl=$('prevlist');
    prev.forEach(function(s){
      if(!s||!/^https:\/\//i.test(s.url))return;
      var li=document.createElement('li'),a=document.createElement('a'),h=document.createElement('span'),m=document.createElement('span');
      a.href=s.url;a.target='_blank';a.rel='noopener noreferrer';h.className='ph';h.textContent=s.headline||s.url;
      m.className='pm';m.textContent=[s.section,s.date].filter(Boolean).join(' · ');
      a.appendChild(h);if(m.textContent)a.appendChild(m);li.appendChild(a);pl.appendChild(li);
    });
    $('prev').hidden=!pl.children.length;
    $('next').hidden=!(SET&&idx<LIST.length-1);
    var sheet=$('sheet'),reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function finish(){sheet.classList.add('gone');$('blurb').hidden=true;$('result').classList.add('show');$('card').focus();}
    if(reduce){finish();return;}
    sheet.classList.remove('enter');
    sheet.style.maxHeight=sheet.scrollHeight+'px';
    void sheet.offsetHeight;
    sheet.classList.add('melting');sheet.style.maxHeight='0px';
    var fin=false,mine=idx;function once(){if(fin||mine!==idx)return;fin=true;finish();}
    sheet.addEventListener('transitionend',function(ev){if(ev.propertyName==='max-height')once();});
    setTimeout(once,900);
  });
  $('next').addEventListener('click',function(){if(idx<LIST.length-1)show(idx+1,true);});
  show(0,false);
})();
</script></body></html>
